name: handshaker_open
description: "Open-source reimplementation of Smartisan HandShaker — cross-platform phone<->desktop file/media management over SSP."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- SSP protocol layer ---
  protobuf: ^6.1.0
  pointycastle: ^4.0.0
  crypto: ^3.0.6
  fixnum: ^1.1.0
  collection: ^1.19.1
  path: ^1.9.1

  # --- platform services ---
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  device_info_plus: ^12.2.0
  permission_handler: ^12.0.1
  photo_manager: ^3.7.1
  installed_apps: ^1.5.2
  network_info_plus: ^6.1.4
  flutter_foreground_task: ^9.1.0

  # --- host UI ---
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.3
  file_selector: ^1.0.4
  desktop_drop: ^0.8.4
  mime: ^2.0.0
  audioplayers: ^6.1.0
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
